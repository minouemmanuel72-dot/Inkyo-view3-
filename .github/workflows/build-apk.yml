name: Construire l'APK Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install --legacy-peer-deps

      - name: Aligner les versions avec Expo
        run: npx expo install --fix

      - name: Vérifier le projet
        run: npx expo-doctor
        continue-on-error: true

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Construire l'APK
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Préparer les fichiers
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk "out/mangi-${{ github.run_number }}.apk"
          cp package.json out/package.resolved.json

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mangi APK ${{ github.run_number }}
          body: Version de test de Mangi. Télécharge le fichier .apk et installe-le sur ton téléphone Android.
          files: out/*
          prerelease: true
